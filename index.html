<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Stimmgerät</title>
    <meta name="description" content="Präzises Stimmgerät für Gitarre und Ukulele" />
    <meta name="theme-color" content="#0d1117" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <h1 class="sr-only">Stimmgerät</h1>

      <header class="topbar">
        <div class="segmented" id="instrument-tabs" role="tablist" aria-label="Instrument">
          <button type="button" role="tab" data-instrument="guitar">Gitarre</button>
          <button type="button" role="tab" data-instrument="ukulele">Ukulele</button>
          <button type="button" role="tab" data-instrument="chromatic">Chromatisch</button>
        </div>
        <button id="btn-settings" class="icon-btn" type="button" aria-label="Einstellungen">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M19.14 12.94a7.07 7.07 0 0 0 .06-.94 7.07 7.07 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.62l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.86a.5.5 0 0 0 .12.62l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.62l1.92 3.32c.13.22.39.3.6.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54a7.03 7.03 0 0 0 1.62-.94l2.39.96c.22.08.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.62l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"
            />
          </svg>
        </button>
      </header>

      <div class="tuning-row" id="tuning-row">
        <label for="tuning-select">Stimmung</label>
        <select id="tuning-select"></select>
      </div>

      <main class="meter" id="meter" data-state="idle">
        <svg id="gauge" viewBox="0 0 320 178" role="img" aria-label="Abweichung in Cent">
          <path id="gauge-zone" class="zone" />
          <g id="gauge-ticks"></g>
          <g id="needle">
            <line x1="160" y1="165" x2="160" y2="34" />
          </g>
          <circle class="hub" cx="160" cy="165" r="7" />
        </svg>

        <div class="level" aria-hidden="true"><div id="level-bar"></div></div>

        <div class="readout" id="readout" aria-live="off">
          <div class="note"><span id="note-name">–</span><sub id="note-octave"></sub></div>
          <div class="cents" id="cents">&nbsp;</div>
          <div class="hint" id="hint">Saite anzupfen</div>
          <div class="freq" id="freq">&nbsp;</div>
        </div>

        <div class="startbox" id="startbox">
          <button id="btn-start" class="primary" type="button">Mikrofon einschalten</button>
          <p id="error" class="error" role="alert" hidden></p>
        </div>
      </main>

      <section class="strings" id="strings" aria-label="Saiten"></section>

      <footer class="toggles">
        <button id="btn-auto" class="chip" type="button" aria-pressed="true">Auto-Erkennung</button>
        <button id="btn-ref" class="chip" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path
              fill="currentColor"
              d="M3 10v4h4l5 5V5L7 10H3Zm13.5 2a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12ZM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54Z"
            />
          </svg>
          <span id="btn-ref-label">Referenzton</span>
        </button>
      </footer>
    </div>

    <dialog id="settings" aria-labelledby="settings-title">
      <form method="dialog">
        <h2 id="settings-title">Einstellungen</h2>

        <div class="setting">
          <div>
            <div class="setting-title">Kammerton A4</div>
            <div class="setting-sub">Standard: 440 Hz</div>
          </div>
          <div class="stepper">
            <button type="button" id="a4-minus" aria-label="Kammerton verringern">−</button>
            <output id="a4-value">440 Hz</output>
            <button type="button" id="a4-plus" aria-label="Kammerton erhöhen">+</button>
          </div>
        </div>

        <label class="setting">
          <div>
            <div class="setting-title">Deutsche Notennamen</div>
            <div class="setting-sub">H statt B</div>
          </div>
          <input type="checkbox" class="switch" id="opt-german" />
        </label>

        <label class="setting">
          <div>
            <div class="setting-title">Vibration</div>
            <div class="setting-sub">Kurz vibrieren, wenn die Saite stimmt</div>
          </div>
          <input type="checkbox" class="switch" id="opt-vibrate" />
        </label>

        <button class="primary" type="submit">Fertig</button>
        <p class="version">Version 1.1 · funktioniert offline · keine Datenübertragung</p>
      </form>
    </dialog>

    <noscript><p class="error">Diese App benötigt JavaScript.</p></noscript>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
